<!DOCTYPE html> <html lang="pl"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Logowanie — ForReal Studio</title>

<link rel="stylesheet" href="style.css">
</head> <body>
<main class="auth-page">

    <section class="auth-card">

        <a href="index.html" class="auth-logo">
            ForReal<span>_</span>
        </a>

        <div class="auth-heading">
            <span>FORREAL ACCOUNT</span>

            <h1>Zaloguj się</h1>

            <p>Wróć do swojego konta.</p>
        </div>

        <form id="loginForm">

            <label for="email">Email</label>

            <input
                type="email"
                id="email"
                placeholder="twoj@email.com"
                required
            >

            <label for="password">Hasło</label>

            <input
                type="password"
                id="password"
                placeholder="Twoje hasło"
                required
            >

            <button
                type="submit"
                class="button primary auth-button"
            >
                Zaloguj się
            </button>

            <p id="loginMessage" class="auth-message"></p>

        </form>

        <div class="auth-footer">
            <span>Nie masz konta?</span>
            <a href="register.html">Utwórz konto</a>
        </div>

    </section>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="auth.js"></script>
</body> </html>
